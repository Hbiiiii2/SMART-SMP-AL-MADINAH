# ==============================================================================
# Konfigurasi White-Label SMART-CBT Exambro
# Ubah nilai di file ini untuk mengganti nama aplikasi, ID paket, domain default,
# maupun kode akses saat membangun APK untuk sekolah lain.
# ==============================================================================

APP_NAME=SMART-CBT
APPLICATION_ID=id.sch.smpaickkmbs.smartcbt

# URL utama yang dibuka pertama kali oleh aplikasi
DEFAULT_BASE_URL=https://ujian.smpaickkmb.sch.id

# Daftar host yang diizinkan (pisahkan dengan koma jika lebih dari satu)
ALLOWED_HOSTS=ujian.smpaickkmb.sch.id

# Kode Akses Keluar dari Guru/Pengawas (akan di-hash SHA-256 saat build APK)
DEFAULT_EXIT_PIN=123456

# PIN Pengaturan Operator/Admin tersembunyi (tap 7x judul SMART-CBT)
DEFAULT_ADMIN_PIN=998877

# Aktifkan menu rahasia ganti domain di perangkat via Admin PIN (true / false)
ENABLE_RUNTIME_DOMAIN_SWITCH=true

# Izinkan pilih foto dari galeri/file jika kamera web/perangkat diminta via file chooser (true / false)
ALLOW_GALLERY_DURING_EXAM=true
