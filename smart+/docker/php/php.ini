[PHP]
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
date.timezone = Asia/Jakarta

default_charset = "UTF-8"
expose_php = Off
max_file_uploads = 30
variables_order = "GPCS"
